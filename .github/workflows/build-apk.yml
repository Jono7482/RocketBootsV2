name: Build Rocket Boots APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install System Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libtool libtool-bin libltdl-dev autoconf automake pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev git zip unzip

      - name: Install Buildozer and Cython
        run: |
          pip install --upgrade pip
          pip install --upgrade "Cython==0.29.33" virtualenv "git+https://github.com/kivy/buildozer.git"

      - name: Build Android APK
        run: |
          export ACLOCAL_PATH=/usr/share/aclocal
          buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RocketBoots-Android-APK
          path: bin/*.apk
          if-no-files-found: error
